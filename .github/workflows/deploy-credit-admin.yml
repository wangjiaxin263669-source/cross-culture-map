# 手动部署 credit-admin 为独立隐藏 Netlify 站点
name: Deploy Credit Admin Site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy hidden admin site (Netlify API, non-interactive)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          CREDIT_ADMIN_SITE_ID: ${{ secrets.CREDIT_ADMIN_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "请先在 GitHub Secrets 配置 NETLIFY_AUTH_TOKEN"
            exit 1
          fi
          node scripts/deploy-credit-admin.mjs
