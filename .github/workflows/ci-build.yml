# 推送 main 时仅构建自检，不触发 Netlify 正式部署
name: CI Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/site-health-guardian.mjs --dry-run --quiet
        env:
          SITE_URL: https://ephemeral-bubblegum-a79332.netlify.app
