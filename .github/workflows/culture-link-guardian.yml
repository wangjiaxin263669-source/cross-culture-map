# 半自动：仅手动运行；巡检文化链接，不自动 commit / 不自动部署 Netlify
name: Culture Link Guardian (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run guardian:check
        env:
          CI: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: culture-guardian-report
          path: |
            scripts/guardian-reports/latest.json
          retention-days: 90
          if-no-files-found: ignore
