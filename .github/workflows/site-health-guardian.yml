# 全自动站点托管：每 3 天巡检+安全修复（不改 src/data，不提交代码）
name: Site Health Guardian Auto

on:
  schedule:
    - cron: '0 4 1,4,7,10,13,16,19,22,25,28 * *'
  push:
    branches: [main]
    paths:
      - 'scripts/site-health-guardian.mjs'
      - 'scripts/lib/siteHealth*.mjs'
      - '.github/workflows/site-health-guardian.yml'

permissions:
  contents: read

concurrency:
  group: site-health-guardian
  cancel-in-progress: false

jobs:
  auto-host:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Full auto site health (check + fix + recheck)
        run: node scripts/site-health-guardian.mjs --ci --quiet
        env:
          CI: true
          SITE_URL: https://ephemeral-bubblegum-a79332.netlify.app
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 6c06b462-2090-44e3-8234-e6d929d01674
