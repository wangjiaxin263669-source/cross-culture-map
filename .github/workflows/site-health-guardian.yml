# 半自动：每 3 天巡检正式站，仅报告；不自动触发 Netlify 重建
name: Site Health Guardian (Semi-Auto)

on:
  schedule:
    - cron: '0 4 1,4,7,10,13,16,19,22,25,28 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-health-guardian
  cancel-in-progress: false

jobs:
  check-only:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Site health check (no auto deploy)
        run: node scripts/site-health-guardian.mjs --ci --quiet
        env:
          CI: true
          SITE_URL: https://ephemeral-bubblegum-a79332.netlify.app
          ALLOW_NETLIFY_AUTO_DEPLOY: 'false'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-health-report
          path: scripts/guardian-reports/site-health-latest.json
          retention-days: 30
          if-no-files-found: ignore
