[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["server/data/**", "server/prompts/**"]

[functions.api]
  # 报告生成需调用 DeepSeek，尽量拉长（Pro 最高 60s；超时会在前端显示 502/504）
  timeout = 60

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
