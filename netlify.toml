[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"
  PAYMENT_PROVIDER = "wechat_qr"
  WECHAT_PAY_QR_URL = "/wechat-pay-qr.png"
  WECHAT_PAY_OWNER_NAME = "hchhh"
  NEW_USER_BONUS_CENTS = "50"
  DAILY_LOGIN_BONUS_CENTS = "5"
  DAILY_LOGIN_BONUS_CAP_CENTS = "70"
  RECHARGE_ADMIN_SECRET = "CcMapProdAdmin_7f3e9a2b"
  # 微信登录（在 Netlify Environment variables 配置，勿提交 Git）：
  #   WECHAT_OPEN_APP_ID=
  #   WECHAT_OPEN_APP_SECRET=
  FRONTEND_URL = "https://ephemeral-bubblegum-a79332.netlify.app"
  WECHAT_REDIRECT_URI = "https://ephemeral-bubblegum-a79332.netlify.app/api/auth/wechat/callback"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = [
    "server/data/**",
    "server/prompts/**",
    "server/prompts/cross-cultural-research-SKILL-compact.md",
    "server/data/corpus-snippets.json",
    "server/auth/**",
    "server/db/**",
    "server/wallet/**",
    "server/payment/**"
  ]

[functions.api]
  # 报告生成需调用 DeepSeek，尽量拉长（Pro 最高 60s；超时会在前端显示 502/504）
  timeout = 60

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
