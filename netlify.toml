[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"
  PAYMENT_PROVIDER = "wechat_qr"
  WECHAT_PAY_QR_URL = "/wechat-pay-qr.png"
  WECHAT_PAY_OWNER_NAME = "hchhh"
  NEW_USER_BONUS_CENTS = "50"
  DAILY_LOGIN_BONUS_CENTS = "6"
  DEEPSEEK_MODEL = "deepseek-v4-flash"
  FRONTEND_URL = "https://ephemeral-bubblegum-a79332.netlify.app"

# 运行时（Functions）可读；仅 build.environment 时 Lambda 可能拿不到
[context.production.environment]
  PAYMENT_PROVIDER = "wechat_qr"
  FRONTEND_URL = "https://ephemeral-bubblegum-a79332.netlify.app"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = [
    "server/data/**",
    "server/prompts/**",
    "server/prompts/cross-cultural-research-SKILL-compact.md",
    "server/data/corpus-snippets.json",
    "server/auth/**",
    "server/db/**",
    "server/wallet/**",
    "server/payment/**",
    "server/simulatedResearch/**",
    "node_modules/mammoth/**",
    "node_modules/pdf-parse/**",
    "node_modules/officeparser/**"
  ]

[functions.api]
  # 报告生成需调用 DeepSeek，尽量拉长（Pro 最高 60s；超时会在前端显示 502/504）
  timeout = 60

[functions.api.environment]
  PAYMENT_PROVIDER = "wechat_qr"
  FRONTEND_URL = "https://ephemeral-bubblegum-a79332.netlify.app"
  NEW_USER_BONUS_CENTS = "50"
  DAILY_LOGIN_BONUS_CENTS = "6"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
